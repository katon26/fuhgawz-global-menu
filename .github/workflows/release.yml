name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build & Test Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gnome-shell \
            libglib2.0-bin \
            gjs \
            zip

      - name: Compile GSettings Schemas
        run: |
          glib-compile-schemas schemas/

      - name: Run Automated Test Suite
        run: |
          gjs -m tests/test_profileManager.js
          gjs -m tests/test_hoverSubMenu_logic.js
          gjs -m tests/test_buttonPool_logic.js
          gjs -m tests/test_virtualKeyboard.js

      - name: Package Extension Bundle
        run: |
          mkdir -p build
          gnome-extensions pack \
            --extra-source=src/ \
            --extra-source=profiles/ \
            --extra-source=icons/ \
            --extra-source=sysmenu/ \
            --extra-source=app/ \
            --extra-source=prefs.css \
            --extra-source=stylesheet.css \
            --extra-source=schemas/ \
            --out-dir=build/ \
            --force

      - name: Generate Checksums
        run: |
          cd build
          sha256sum *.zip > fuhgawzglbmenu@katon26.github.io.shell-extension.zip.sha256
          cat fuhgawzglbmenu@katon26.github.io.shell-extension.zip.sha256

      - name: Determine Release Notes
        id: release_notes
        run: |
          if [ -f "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md" ]; then
            echo "path=docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md" >> $GITHUB_OUTPUT
          elif [ -f "docs/RELEASE_NOTES_v1.0.0.md" ]; then
            echo "path=docs/RELEASE_NOTES_v1.0.0.md" >> $GITHUB_OUTPUT
          else
            echo "path=CHANGELOG.md" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/*.sha256
          body_path: ${{ steps.release_notes.outputs.path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
